[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "open-node-agent"
version = "0.1.0"
description = "License-free Open Node host agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.28,<1.0",
  "pydantic>=2.9,<3.0",
  "psutil>=6.0,<8.0",
  "pyyaml>=6.0,<7.0",
  "websockets>=15.0,<18.0",
]

[project.scripts]
open-node-agent = "open_node_agent.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.8,<1.0", "build>=1.2,<2.0"]

[tool.hatch.build.targets.wheel]
packages = ["app/open_node_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
