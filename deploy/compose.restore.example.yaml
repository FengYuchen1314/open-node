# Separate restored instance. Do not point this at the original live data directory.
name: open-node-restored
services:
  open-node:
    image: ${OPEN_NODE_RESTORE_IMAGE:?Select a locally built image containing the restore feature}
    pull_policy: never
    user: "10001:10001"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - ${OPEN_NODE_RESTORE_DATA_DIR:?Select the NEW restored directory}/restore.env
    environment:
      OPEN_NODE_SESSION_COOKIE_SECURE: ${OPEN_NODE_SESSION_COOKIE_SECURE:-true}
      OPEN_NODE_AGENT_BOOTSTRAP_PUBLIC_URL: ${OPEN_NODE_AGENT_BOOTSTRAP_PUBLIC_URL:-}
      OPEN_NODE_SHORT_LINKS_ENABLED: ${OPEN_NODE_SHORT_LINKS_ENABLED:-false}
      FORWARDED_ALLOW_IPS: ${OPEN_NODE_TRUSTED_PROXIES:-}
    ports:
      - "127.0.0.1:${OPEN_NODE_RESTORE_HTTP_PORT:?Select an unused loopback restore port}:62031"
    volumes:
      - type: bind
        source: ${OPEN_NODE_RESTORE_DATA_DIR:?Select the NEW restored directory}
        target: /var/lib/open-node
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    stop_grace_period: 30s
