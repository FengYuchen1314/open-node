name: open-node
services:
  open-node:
    image: ${OPEN_NODE_IMAGE_REPOSITORY:-open-node}:${OPEN_NODE_IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VCS_REF: ${OPEN_NODE_REVISION:-unknown}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
    ports:
      - "${OPEN_NODE_BIND_ADDRESS:-127.0.0.1}:${OPEN_NODE_HTTP_PORT:-62031}:62031"
    environment:
      OPEN_NODE_DATABASE_URL: ${OPEN_NODE_DATABASE_URL:-sqlite:////var/lib/open-node/open-node.db}
      OPEN_NODE_CONTROL_STATE_DIR: /var/lib/open-node
      OPEN_NODE_SESSION_COOKIE_SECURE: ${OPEN_NODE_SESSION_COOKIE_SECURE:-true}
      OPEN_NODE_SUBSCRIBER_TOTP_KEY: ${OPEN_NODE_SUBSCRIBER_TOTP_KEY:-}
      OPEN_NODE_GEOIP_IPINFO_TOKEN: ${OPEN_NODE_GEOIP_IPINFO_TOKEN:-}
      OPEN_NODE_EXTERNAL_SUBSCRIPTIONS_STATE_DIR: /var/lib/open-node/external-subscriptions
      OPEN_NODE_FEDERATION_STATE_DIR: /var/lib/open-node/federation
      OPEN_NODE_NOTIFICATIONS_STATE_DIR: /var/lib/open-node/notifications
      OPEN_NODE_SPEEDTEST_STATE_DIR: /var/lib/open-node/speedtests
      OPEN_NODE_SHORT_LINKS_ENABLED: ${OPEN_NODE_SHORT_LINKS_ENABLED:-false}
      OPEN_NODE_AGENT_IDENTITY_FILE: ${OPEN_NODE_AGENT_IDENTITY_FILE:-}
      OPEN_NODE_AGENT_BOOTSTRAP_PUBLIC_URL: ${OPEN_NODE_AGENT_BOOTSTRAP_PUBLIC_URL:-}
      OPEN_NODE_SOURCE_REVISION: ${OPEN_NODE_REVISION:-unknown}
      OPEN_NODE_BROWSER_RESTORE_AUTO_RESTART: "true"
      OPEN_NODE_APPLICATION_UPDATE_DIR: /run/open-node-maintenance
      OPEN_NODE_APPLICATION_UPDATE_STATE_OWNER_UID: "0"
      OPEN_NODE_APPLICATION_UPDATE_STATE_GROUP_GID: "10001"
      FORWARDED_ALLOW_IPS: ${OPEN_NODE_TRUSTED_PROXIES:-}
    volumes:
      - data:/var/lib/open-node
      - type: bind
        source: ${OPEN_NODE_APPLICATION_UPDATE_HOST_DIR:-/var/lib/open-node-maintenance-manual}
        target: /run/open-node-maintenance
    stop_grace_period: 30s
volumes:
  data:
