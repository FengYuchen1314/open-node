name: open-node
services:
  open-node:
    image: open-node:${OPEN_NODE_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VCS_REF: ${OPEN_NODE_REVISION:-unknown}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m,mode=1777
    ports:
      - "127.0.0.1:${OPEN_NODE_HTTP_PORT:-8080}:8080"
    environment:
      OPEN_NODE_SESSION_COOKIE_SECURE: ${OPEN_NODE_SESSION_COOKIE_SECURE:-true}
      OPEN_NODE_SUBSCRIBER_TOTP_KEY: ${OPEN_NODE_SUBSCRIBER_TOTP_KEY:-}
      OPEN_NODE_AGENT_IDENTITY_FILE: ${OPEN_NODE_AGENT_IDENTITY_FILE:-}
      FORWARDED_ALLOW_IPS: ${OPEN_NODE_TRUSTED_PROXIES:-}
    volumes:
      - data:/var/lib/open-node
    stop_grace_period: 30s
volumes:
  data:
