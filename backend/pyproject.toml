[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "open-node-backend"
version = "0.1.0"
description = "FastAPI backend for the Open Node MMWX refactor"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "FengYuchen1314" }
]
dependencies = [
  "acme==5.7.0",
  "crossplane>=0.5.8,<0.6",
  "cryptography>=44,<47",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1.0",
  "pyyaml>=6.0,<7.0",
  "pydantic-settings>=2.6,<3.0",
  "pwdlib[argon2,bcrypt]>=0.3,<1.0",
  "pyotp==2.10.0",
  "sqlalchemy>=2.0,<3.0",
  "tzdata>=2026.1,<2027",
  "uvicorn[standard]>=0.32,<1.0"
]

[project.scripts]
open-node-admin = "open_node.admin:main"

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0"
]

browser = ["playwright>=1.55,<2.0"]
acme-test = ["dnslib>=0.9.26,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["app/open_node"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
