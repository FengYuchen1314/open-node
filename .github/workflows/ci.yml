name: CI

on:
  push:
    branches:
      - '**'
    # Agent release tags point to source already covered by the main push.
    tags-ignore:
      - 'agent-v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    # The expanded integration suite exceeded the previous 60-minute cutoff
    # without reporting a test failure on the hosted runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "backend[dev]"
      - run: ruff check backend
      - run: pytest backend/tests

  postgresql:
    name: PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15.18-bookworm@sha256:e8db9bd3e9e1751eb639fb17be53cc6d1b62a322adf75b99e791767a7a16ce69
        env:
          POSTGRES_DB: open_node
          POSTGRES_USER: open_node
          POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U open_node -d open_node"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "backend[dev]"
      - run: ruff check backend/tests/test_backup_postgres.py backend/tests/test_postgres_security.py backend/tests/test_postgres_integration.py
      - run: pytest -q backend/tests/test_backup_postgres.py backend/tests/test_postgres_security.py backend/tests/test_postgres_integration.py
        env:
          OPEN_NODE_TEST_POSTGRES_URL: postgresql+psycopg://open_node:0123456789abcdef0123456789abcdef@127.0.0.1:5432/open_node?sslmode=disable

  agent:
    name: Agent
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "agent[dev]"
      - run: ruff check agent
      - name: Test Agent with real filesystem ownership
        # Host-policy fixtures chown private files to a separate service UID.
        # Use the installed interpreter in this disposable hosted runner.
        run: sudo -n -- "$(command -v python)" -m pytest agent/tests
      - run: python -m build --wheel --outdir agent/dist agent

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run build:probe
        working-directory: frontend
      - run: test -f dist-probe/index.html
        working-directory: frontend

  probe-worker:
    name: Probe Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: probe-worker/package-lock.json
      - run: npm ci
        working-directory: probe-worker
      - run: npm test
        working-directory: probe-worker
      - run: npm run typecheck
        working-directory: probe-worker
